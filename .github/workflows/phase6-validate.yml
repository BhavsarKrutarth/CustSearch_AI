name: Phase 6 Validate

on:
  push:
    branches: [phase6-shopper-customers]
  pull_request:
    branches: [AIMainBranch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SA_PASSWORD: 'CustSearch_Phase6_2026!Sql'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424

      - name: Setup Node for pinned Angular 21
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: src/CustSearch.Admin/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build portable SQL Server 2022 canonical through Phase 6
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          canonical = Path('database/CustSearchAi.sql')
          phase5 = Path('database/09_Upgrade/V1.4.0_Phase5_TenantStoresStaff.sql')
          phase6 = Path('database/09_Upgrade/V1.5.0_Phase6_ShopperCustomers.sql')
          raw = canonical.read_bytes()
          if raw.startswith(b'\xff\xfe'):
              encoding = 'utf-16'
          elif raw.startswith(b'\xef\xbb\xbf'):
              encoding = 'utf-8-sig'
          else:
              encoding = 'utf-8'
          text = raw.decode(encoding)
          newline = '\r\n' if '\r\n' in text else '\n'

          portable = newline.join([
              'USE [master]', 'GO',
              '/* CustSearch AI portable bootstrap: SQL Server 2022+, no machine-specific MDF/LDF paths. */',
              "IF DB_ID(N'CustSearch_AI') IS NULL", 'BEGIN', '    CREATE DATABASE [CustSearch_AI];', 'END', 'GO'
          ])
          pattern = r"USE \[master\]\s*\r?\nGO\s*\r?\n/\*\*\*\*\*\* Object:  Database \[CustSearch_AI\].*?WITH CATALOG_COLLATION = DATABASE_DEFAULT, LEDGER = OFF\s*\r?\nGO"
          text, replaced = re.subn(pattern, portable, text, count=1, flags=re.S)
          if replaced == 0 and "IF DB_ID(N'CustSearch_AI') IS NULL" not in text:
              raise SystemExit('Could not normalize canonical CREATE DATABASE header safely.')
          text = re.sub(r"ALTER DATABASE \[CustSearch_AI\] SET OPTIMIZED_LOCKING = OFF\s*\r?\nGO\s*\r?\n", '', text, count=1)

          def ensure_phase(current: str, required_signatures: list[str], header_lines: list[str], script: Path) -> str:
              if all(signature in current for signature in required_signatures):
                  return current
              block = script.read_text(encoding='utf-8-sig').strip()
              header = newline.join(header_lines)
              return current.rstrip() + newline + newline + header + newline + block.replace('\n', newline) + newline

          phase5_signatures = [
              "OBJECT_ID(N'dbo.Stores', N'U') IS NULL",
              "OBJECT_ID(N'dbo.UserStoreAssignments', N'U') IS NULL",
              "OBJECT_ID(N'dbo.StaffProfiles', N'U') IS NULL",
              "OBJECT_ID(N'dbo.ProductCategories', N'U') IS NULL",
              "OBJECT_ID(N'dbo.StoreVoiceCommandSettings', N'U') IS NULL",
              "VersionNumber=N'V1.4.0'",
          ]
          text = ensure_phase(text, phase5_signatures, [
              '-- ============================================================',
              '-- PHASE 5 - TENANT USERS / STORES / STAFF',
              '-- SUB-PHASE: 5A - Tenant Users / Roles / ShopOwner / TenantOwner',
              '-- SUB-PHASE: 5B - User-Store Assignments / Authoritative Store Scope / Quotas',
              '-- SUB-PHASE: 5C - Store Master / Location / Geofence / Lifecycle',
              '-- SUB-PHASE: 5D - Staff Profiles / Shifts / Presence',
              '-- SUB-PHASE: 5E - Store Product Categories',
              '-- SUB-PHASE: 5F - Dynamic Store Voice Trigger / Aliases',
              '-- SUB-PHASE: 5G - Customer Admin Dashboard Base',
              '-- SUB-PHASE: 5H - Completion / Validation / Canonical Database Gate',
              '-- VERSION: V1.4.0',
              '-- ============================================================'], phase5)

          if not all(signature in text for signature in phase5_signatures):
              raise SystemExit('Phase 5 canonical body is incomplete after merge.')

          # Upgrade proof starts from the normalized, completed Phase 5 canonical state.
          Path('/tmp/CustSearchAi.pre-phase6.sql').write_text(text, encoding='utf-8')

          phase6_signatures = [
              "OBJECT_ID(N'dbo.Customers', N'U') IS NULL",
              "OBJECT_ID(N'dbo.CustomerStoreAssignments', N'U') IS NULL",
              "OBJECT_ID(N'dbo.AnonymousVisitors', N'U') IS NULL",
              'CREATE OR ALTER PROCEDURE dbo.Customer_Search',
              'CREATE OR ALTER PROCEDURE dbo.AnonymousVisitor_Search',
              "VersionNumber=N'V1.5.0'",
          ]
          text = ensure_phase(text, phase6_signatures, [
              '-- ============================================================',
              '-- PHASE 6 - SHOPPER CUSTOMERS / ANONYMOUS VISITORS',
              '-- SUB-PHASE: 6A - Customer Management',
              '-- SUB-PHASE: 6B - Anonymous Visitors',
              '-- SUB-PHASE: 6C - Customer Search',
              '-- SUB-PHASE: 6D - Smart Customer Profile',
              '-- SUB-PHASE: 6E - Angular Customer UI',
              '-- SUB-PHASE: 6F - Angular Visitor UI',
              '-- SUB-PHASE: 6G - Tenant Isolation & Authorization',
              '-- SUB-PHASE: 6H - E2E / Database / Documentation',
              '-- VERSION: V1.5.0',
              '-- ============================================================'], phase6)

          if not all(signature in text for signature in phase6_signatures):
              raise SystemExit('Phase 6 canonical body is incomplete after merge.')

          canonical.write_bytes(text.encode(encoding))
          print(f'Canonical SQL normalized/merged through Phase 6 using {encoding}')
          PY

      - name: Restore .NET
        run: dotnet restore CustSearch_AI.sln

      - name: Build .NET
        run: dotnet build CustSearch_AI.sln --configuration Release --no-restore

      - name: Test .NET
        run: dotnet test CustSearch_AI.sln --configuration Release --no-build --logger "trx;LogFileName=phase6-tests.trx"

      - name: Install Angular dependencies reproducibly
        working-directory: src/CustSearch.Admin
        run: npm ci --no-audit --no-fund

      - name: Angular version
        working-directory: src/CustSearch.Admin
        run: npx ng version

      - name: Lint Angular
        working-directory: src/CustSearch.Admin
        run: npm run lint

      - name: Test Angular
        working-directory: src/CustSearch.Admin
        run: npm run test:ci

      - name: Build Angular production
        working-directory: src/CustSearch.Admin
        run: npm run build:production

      - name: Prepare pinned Playwright E2E dependencies
        working-directory: tests/CustSearch.Admin.E2E
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Phase 5 and Phase 6 Playwright regression suite
        working-directory: tests/CustSearch.Admin.E2E
        run: npm test

      - name: Validate Python baseline
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r src/CustSearch.AI/requirements-dev.txt
          ruff check src/CustSearch.AI tests/CustSearch.AI.Tests
          PYTHONPATH=src/CustSearch.AI python -m pytest -q tests/CustSearch.AI.Tests

      - name: Validate Phase 6 SQL structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('database/CustSearchAi.sql').read_bytes()
          enc = 'utf-16' if raw.startswith(b'\xff\xfe') else ('utf-8-sig' if raw.startswith(b'\xef\xbb\xbf') else 'utf-8')
          sql = raw.decode(enc)
          required = [
              "IF DB_ID(N'CustSearch_AI') IS NULL",
              'PHASE 5 - TENANT USERS / STORES / STAFF', 'VERSION: V1.4.0',
              "OBJECT_ID(N'dbo.Stores', N'U') IS NULL",
              "OBJECT_ID(N'dbo.UserStoreAssignments', N'U') IS NULL",
              "OBJECT_ID(N'dbo.StaffProfiles', N'U') IS NULL",
              "OBJECT_ID(N'dbo.ProductCategories', N'U') IS NULL",
              "OBJECT_ID(N'dbo.StoreVoiceCommandSettings', N'U') IS NULL",
              "VersionNumber=N'V1.4.0'",
              'PHASE 6 - SHOPPER CUSTOMERS / ANONYMOUS VISITORS',
              'SUB-PHASE: 6A', 'SUB-PHASE: 6B', 'SUB-PHASE: 6C', 'SUB-PHASE: 6D',
              'SUB-PHASE: 6E', 'SUB-PHASE: 6F', 'SUB-PHASE: 6G', 'SUB-PHASE: 6H', 'VERSION: V1.5.0',
              'dbo.Customers', 'dbo.CustomerStoreAssignments', 'dbo.AnonymousVisitors',
              'CREATE OR ALTER PROCEDURE dbo.Customer_Search',
              'CREATE OR ALTER PROCEDURE dbo.AnonymousVisitor_Search',
              'FK_CustomerStoreAssignments_Customers_TenantCustomer',
              'FK_AnonymousVisitors_Stores_TenantStore',
              "VersionNumber=N'V1.5.0'",
          ]
          missing = [item for item in required if item not in sql]
          if missing:
              raise SystemExit(f'Missing canonical Phase 5/6 markers/objects: {missing}')
          if 'MSSQL17.MSSQLSERVER' in sql or 'OPTIMIZED_LOCKING' in sql:
              raise SystemExit('Canonical SQL still contains machine/SQL Server 17-specific statements.')
          for table in ['Stores','UserStoreAssignments','StaffProfiles','ProductCategories','StoreVoiceCommandSettings','Customers','CustomerStoreAssignments','AnonymousVisitors']:
              if f"OBJECT_ID(N'dbo.{table}', N'U') IS NULL" not in sql:
                  raise SystemExit(f'Missing repeat-safe create guard for {table}')
          PY

      - name: Validate Phase 6 upgrade twice on SQL Server 2022
        shell: bash
        run: |
          docker run -d --name phase6-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -p 14334:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in {1..60}; do
            if docker exec phase6-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then break; fi
            if [ "$i" = 60 ]; then docker logs phase6-sql; exit 1; fi
            sleep 2
          done
          docker cp /tmp/CustSearchAi.pre-phase6.sql phase6-sql:/tmp/pre.sql
          docker cp database/09_Upgrade/V1.5.0_Phase6_ShopperCustomers.sql phase6-sql:/tmp/phase6.sql
          docker exec phase6-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -i /tmp/pre.sql
          docker exec phase6-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -Q "IF OBJECT_ID(N'dbo.Stores',N'U') IS NULL THROW 51180,'Phase 5 Stores missing before Phase 6',1; IF OBJECT_ID(N'dbo.UserStoreAssignments',N'U') IS NULL THROW 51181,'Phase 5 UserStoreAssignments missing before Phase 6',1; IF OBJECT_ID(N'dbo.StaffProfiles',N'U') IS NULL THROW 51182,'Phase 5 StaffProfiles missing before Phase 6',1; IF (SELECT COUNT(*) FROM dbo.DatabaseVersions WHERE VersionNumber=N'V1.4.0')<>1 THROW 51183,'Expected exactly one V1.4.0 row before Phase 6',1;"
          docker exec phase6-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/phase6.sql
          docker exec phase6-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/phase6.sql
          docker exec phase6-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -Q "IF (SELECT COUNT(*) FROM dbo.DatabaseVersions WHERE VersionNumber=N'V1.5.0')<>1 THROW 51190,'V1.5.0 repeat safety failed',1; IF OBJECT_ID(N'dbo.Customers',N'U') IS NULL OR OBJECT_ID(N'dbo.Customer_Search',N'P') IS NULL OR OBJECT_ID(N'dbo.AnonymousVisitor_Search',N'P') IS NULL THROW 51191,'Phase 6 objects missing',1; IF NOT EXISTS(SELECT 1 FROM sys.foreign_keys WHERE name=N'FK_AnonymousVisitors_Stores_TenantStore') THROW 51192,'Tenant-safe visitor FK missing',1;"

      - name: Validate tenant/store predicates in Phase 6 stored procedures
        shell: bash
        run: |
          docker exec phase6-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -Q "IF OBJECT_DEFINITION(OBJECT_ID(N'dbo.Customer_Search')) NOT LIKE '%TenantId=@TenantId%' THROW 51193,'Customer_Search tenant predicate missing',1; IF OBJECT_DEFINITION(OBJECT_ID(N'dbo.AnonymousVisitor_Search')) NOT LIKE '%TenantId=@TenantId%' THROW 51194,'AnonymousVisitor_Search tenant predicate missing',1;"

      - name: Validate final canonical fresh install on SQL Server 2022
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('database/CustSearchAi.sql').read_bytes()
          enc='utf-16' if raw.startswith(b'\xff\xfe') else ('utf-8-sig' if raw.startswith(b'\xef\xbb\xbf') else 'utf-8')
          Path('/tmp/CustSearchAi.final.sql').write_text(raw.decode(enc),encoding='utf-8')
          PY
          docker exec phase6-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "ALTER DATABASE [CustSearch_AI] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [CustSearch_AI];"
          docker cp /tmp/CustSearchAi.final.sql phase6-sql:/tmp/final.sql
          docker exec phase6-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -i /tmp/final.sql
          docker exec phase6-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -Q "IF (SELECT COUNT(*) FROM dbo.DatabaseVersions WHERE VersionNumber=N'V1.4.0')<>1 THROW 51195,'Canonical V1.4.0 missing or duplicated',1; IF (SELECT COUNT(*) FROM dbo.DatabaseVersions WHERE VersionNumber=N'V1.5.0')<>1 THROW 51196,'Canonical V1.5.0 missing or duplicated',1; IF OBJECT_ID(N'dbo.Stores',N'U') IS NULL THROW 51197,'Canonical Phase 5 Stores missing',1; IF OBJECT_ID(N'dbo.Customers',N'U') IS NULL THROW 51198,'Canonical Phase 6 Customers missing',1; IF OBJECT_ID(N'dbo.Customer_Search',N'P') IS NULL OR OBJECT_ID(N'dbo.AnonymousVisitor_Search',N'P') IS NULL THROW 51199,'Canonical Phase 6 search procedure missing',1;"

      - name: Stop SQL Server validation container
        if: always()
        run: docker rm -f phase6-sql >/dev/null 2>&1 || true

      - name: Persist generated canonical SQL and E2E lock
        if: github.event_name == 'push'
        shell: bash
        run: |
          if ! git diff --quiet -- database/CustSearchAi.sql tests/CustSearch.Admin.E2E/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add database/CustSearchAi.sql tests/CustSearch.Admin.E2E/package-lock.json
            git commit -m "phase6: persist V1.5 canonical SQL and E2E lock"
            git push origin HEAD:phase6-shopper-customers
          fi

      - name: Create Phase 6 source ZIP
        shell: bash
        run: |
          mkdir -p artifacts
          zip -rq artifacts/CustSearch_AI_Phase6_Final.zip . \
            -x '.git/*' 'artifacts/*' 'src/CustSearch.Admin/node_modules/*' \
               'src/CustSearch.Admin/.angular/*' 'src/CustSearch.Admin/dist/*' \
               'tests/CustSearch.Admin.E2E/node_modules/*' 'tests/CustSearch.Admin.E2E/test-results/*' \
               '**/bin/*' '**/obj/*' '**/TestResults/*' '**/logs/*'

      - name: Upload Phase 6 source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CustSearch_AI_Phase6_Final
          path: artifacts/CustSearch_AI_Phase6_Final.zip
          if-no-files-found: error
          retention-days: 14
