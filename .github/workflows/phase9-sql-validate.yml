name: Phase 9 SQL Only Validate

on:
  push:
    branches: [phase9-platform-billing]
    paths:
      - 'database/**'
      - '.github/workflows/phase9-sql-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-server-2022:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SA_PASSWORD: 'CustSearch_Phase9_SQL_2026!'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare validated V1.7 baseline
        shell: bash
        run: |
          git show origin/AIMainBranch:database/CustSearchAi.sql > /tmp/phase8.raw
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('/tmp/phase8.raw').read_bytes()
          enc='utf-16' if raw.startswith(b'\xff\xfe') else ('utf-8-sig' if raw.startswith(b'\xef\xbb\xbf') else 'utf-8')
          text=raw.decode(enc)
          if "VersionNumber=N'V1.7.0'" not in text:
              raise SystemExit('AIMainBranch canonical must contain V1.7.0.')
          Path('/tmp/phase8.sql').write_text(text,encoding='utf-8')
          PY

      - name: Start SQL Server 2022
        shell: bash
        run: |
          docker run -d --name phase9-sql-only \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            -p 14339:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in {1..60}; do
            if docker exec phase9-sql-only /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$i" = 60 ]; then
              docker logs phase9-sql-only
              exit 1
            fi
            sleep 2
          done

      - name: Install validated Phase 8 baseline
        shell: bash
        run: |
          docker cp /tmp/phase8.sql phase9-sql-only:/tmp/phase8.sql
          docker exec phase9-sql-only /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b \
            -i /tmp/phase8.sql

      - name: Run Phase 9 manual installer first time
        shell: bash
        run: |
          docker cp database/run-phase9.sql phase9-sql-only:/tmp/run-phase9.sql
          docker exec phase9-sql-only /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b \
            -d CustSearch_AI -i /tmp/run-phase9.sql

      - name: Run Phase 9 manual installer second time
        shell: bash
        run: |
          docker exec phase9-sql-only /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b \
            -d CustSearch_AI -i /tmp/run-phase9.sql

      - name: Execute Phase 9 stored procedures
        shell: bash
        run: |
          docker exec phase9-sql-only /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b \
            -d CustSearch_AI -Q "
              EXEC dbo.PlatformBilling_Plan_List @IncludeInactive=1;
              EXEC dbo.PlatformBilling_Subscription_List @TenantId=NULL;
              EXEC dbo.PlatformBilling_Invoice_List @TenantId=NULL,@PageNumber=1,@PageSize=10;
              EXEC dbo.PlatformBilling_Invoice_Get @PlatformInvoiceId=0,@TenantId=NULL;
              EXEC dbo.PlatformBilling_Payment_List @TenantId=NULL,@PlatformInvoiceId=NULL;
              EXEC dbo.TenantPlatformBilling_Summary_Get @TenantId=1;
            "

      - name: Validate Phase 9 schema and separation
        shell: bash
        run: |
          docker exec phase9-sql-only /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b \
            -d CustSearch_AI -Q "
              IF (SELECT COUNT(*) FROM dbo.DatabaseVersions WHERE VersionNumber=N'V1.8.0')<>1
                THROW 51990,'V1.8.0 must exist exactly once.',1;
              IF OBJECT_ID(N'dbo.PlatformInvoices',N'U') IS NULL OR OBJECT_ID(N'dbo.PlatformInvoiceItems',N'U') IS NULL OR OBJECT_ID(N'dbo.PlatformPayments',N'U') IS NULL
                THROW 51991,'Phase 9 tables missing.',1;
              IF OBJECT_ID(N'dbo.PlatformBilling_Plan_List',N'P') IS NULL OR OBJECT_ID(N'dbo.PlatformBilling_Subscription_List',N'P') IS NULL OR OBJECT_ID(N'dbo.PlatformBilling_Invoice_List',N'P') IS NULL OR OBJECT_ID(N'dbo.PlatformBilling_Invoice_Get',N'P') IS NULL OR OBJECT_ID(N'dbo.PlatformBilling_Payment_List',N'P') IS NULL OR OBJECT_ID(N'dbo.TenantPlatformBilling_Summary_Get',N'P') IS NULL
                THROW 51992,'Phase 9 procedures missing.',1;
              IF COL_LENGTH('dbo.SubscriptionPlans','MaxStaff') IS NULL OR COL_LENGTH('dbo.Tenants','MaxStaff') IS NULL OR COL_LENGTH('dbo.TenantSubscriptions','CurrentPeriodEndUtc') IS NULL
                THROW 51993,'Phase 9 columns missing.',1;
              IF NOT EXISTS(SELECT 1 FROM dbo.Permissions WHERE Scope=1 AND Name=N'PlatformBilling.Subscriptions.View')
                 OR NOT EXISTS(SELECT 1 FROM dbo.Permissions WHERE Scope=2 AND Name=N'TenantPlatformBilling.Subscriptions.View')
                THROW 51994,'Phase 9 permission separation missing.',1;
              IF EXISTS(SELECT 1 FROM dbo.Permissions WHERE Scope=2 AND Name IN(N'PlatformBilling.Subscriptions.View',N'PlatformBilling.Invoices.View',N'PlatformBilling.Payments.View'))
                THROW 51995,'Old duplicate tenant permission names remain.',1;
              IF EXISTS(SELECT 1 FROM sys.foreign_keys WHERE parent_object_id=OBJECT_ID(N'dbo.PlatformInvoices') AND referenced_object_id=OBJECT_ID(N'dbo.RetailInvoices'))
                THROW 51996,'Platform billing references RetailInvoices.',1;
              DBCC CHECKCONSTRAINTS WITH ALL_CONSTRAINTS;
              PRINT 'PHASE9_SQL_ONLY_VALIDATION_GREEN';
            "
