name: Phase 10 Validate

on:
  push:
    branches: [phase10-preferences-voice]
  pull_request:
    branches: [AIMainBranch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SA_PASSWORD: 'CustSearch_Phase10_2026!Sql'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424

      - name: Setup Node for pinned Angular 21
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: src/CustSearch.Admin/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare validated Phase 9 baseline and prospective Phase 10 canonical
        shell: bash
        run: |
          git show origin/AIMainBranch:database/CustSearchAi.sql > /tmp/CustSearchAi.phase9-base.raw
          python3 - <<'PY'
          from pathlib import Path
          base_raw=Path('/tmp/CustSearchAi.phase9-base.raw').read_bytes()
          enc='utf-16' if base_raw.startswith(b'\xff\xfe') else ('utf-8-sig' if base_raw.startswith(b'\xef\xbb\xbf') else 'utf-8')
          base=base_raw.decode(enc)
          if "VersionNumber=N'V1.8.0'" not in base:
              raise SystemExit('AIMainBranch must contain validated Phase 9 V1.8.0 before Phase 10.')
          if "VersionNumber=N'V1.9.0'" in base:
              raise SystemExit('AIMainBranch must not contain Phase 10 V1.9.0 before Phase 10 merge.')
          upgrade=Path('database/09_Upgrade/V1.9.0_Phase10_PreferencesVoice.sql').read_text(encoding='utf-8-sig')
          branch_raw=Path('database/CustSearchAi.sql').read_bytes()
          branch_enc='utf-16' if branch_raw.startswith(b'\xff\xfe') else ('utf-8-sig' if branch_raw.startswith(b'\xef\xbb\xbf') else 'utf-8')
          branch=branch_raw.decode(branch_enc)
          final=branch if "VersionNumber=N'V1.9.0'" in branch else base.rstrip()+"\n\n-- ============================================================\n-- PHASE 10 - PREFERENCES & STAFF VOICE TAGGING\n-- VERSION: V1.9.0\n-- ============================================================\n"+upgrade.strip()+"\n"
          Path('/tmp/CustSearchAi.phase9-base.sql').write_text(base,encoding='utf-8')
          Path('/tmp/CustSearchAi.phase10-final.sql').write_text(final,encoding='utf-8')
          PY

      - name: Restore .NET
        run: dotnet restore CustSearch_AI.sln

      - name: Build .NET Release
        run: dotnet build CustSearch_AI.sln --configuration Release --no-restore

      - name: Test .NET through Phase 10
        run: dotnet test CustSearch_AI.sln --configuration Release --no-build --logger "trx;LogFileName=phase10-tests.trx"

      - name: Install Angular dependencies reproducibly
        working-directory: src/CustSearch.Admin
        run: npm ci --no-audit --no-fund

      - name: Angular version
        working-directory: src/CustSearch.Admin
        run: npx ng version

      - name: Lint Angular
        working-directory: src/CustSearch.Admin
        run: npm run lint

      - name: Test Angular through Phase 10
        working-directory: src/CustSearch.Admin
        run: npm run test:ci

      - name: Build Angular production
        working-directory: src/CustSearch.Admin
        run: npm run build:production

      - name: Prepare Playwright
        working-directory: tests/CustSearch.Admin.E2E
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts --no-audit --no-fund; fi
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run full Playwright regression through Phase 10
        working-directory: tests/CustSearch.Admin.E2E
        run: npm test

      - name: Validate Python baseline
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r src/CustSearch.AI/requirements-dev.txt
          ruff check src/CustSearch.AI tests/CustSearch.AI.Tests
          PYTHONPATH=src/CustSearch.AI python -m pytest -q tests/CustSearch.AI.Tests

      - name: Validate Phase 10 planning, security and SQL structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          upgrade=Path('database/09_Upgrade/V1.9.0_Phase10_PreferencesVoice.sql').read_text(encoding='utf-8-sig')
          runner=Path('database/run-phase10.sql').read_text(encoding='utf-8-sig')
          verifier=Path('database/verify-phase10.sql').read_text(encoding='utf-8-sig')
          required=[
            'dbo.CustomerPreferenceSignals','dbo.CustomerPreferenceScores','dbo.HouseholdPreferenceTags',
            'dbo.ProductCategoryAliases','dbo.StoreVoiceCommandRuntimeSettings','dbo.VoiceCommandSessions',
            'dbo.PreferenceWeightVersions','dbo.CustomerPreference_Get','dbo.HouseholdPreference_Get',
            'dbo.ProductCategoryAlias_Search','dbo.PreferenceWeight_GetActive','dbo.PreferenceAudit_Search',
            "VersionNumber=N'V1.9.0'",'@AllowedStoreIdsCsv','IsVerified=1'
          ]
          missing=[x for x in required if x not in upgrade or x not in runner]
          if missing: raise SystemExit(f'Missing Phase 10 SQL elements: {missing}')
          def executable_sql(text:str)->str:
              text=re.sub(r'/\*.*?\*/','',text,flags=re.S)
              return re.sub(r'--[^\r\n]*','',text)
          for name,text in [('runner',runner),('verifier',verifier)]:
              low=executable_sql(text).lower()
              if ':r ' in low or 'powershell' in low: raise SystemExit(f'{name} must remain standalone T-SQL.')
          service=Path('src/CustSearch.Infrastructure/PreferencesVoice/PreferencesVoiceService.cs').read_text(encoding='utf-8-sig')
          controller=Path('src/CustSearch.API/Controllers/PreferencesVoiceController.cs').read_text(encoding='utf-8-sig')
          contract=Path('src/CustSearch.Application/PreferencesVoice/IPreferencesVoiceService.cs').read_text(encoding='utf-8-sig')
          if '"Aasha Add"' in service: raise SystemExit('Voice service must not hard-code Aasha Add as parser behavior.')
          if 'ProductCategoryAliases' not in service or 'ResolveCategoryCandidatesAsync' not in service: raise SystemExit('Server-side category/alias resolution is missing.')
          dto=controller[controller.index('public sealed record InterpretVoiceSessionRequest'):]
          dto=dto.split('\n',1)[0]
          for forbidden in ['TenantId','PreferenceType','ReferenceId',' Value','StoreId','CustomerId']:
              if forbidden in dto: raise SystemExit(f'Voice interpretation DTO trusts forbidden field: {forbidden}')
          if 'SelectedCategoryId' not in dto: raise SystemExit('Ambiguous server candidate selection is missing.')
          if 'VisitParty' in contract[contract.index('AddHouseholdPreferenceTagCommand'):contract.index('SavePreferenceWeightCommand')]: raise SystemExit('Household preference contract must not use VisitParty.')
          if 'AutoCreateCategory' in upgrade or 'GeneratedCategoryId' in upgrade: raise SystemExit('Voice schema must not support automatic category creation.')
          angular=Path('src/CustSearch.Admin/src/app/features/preferences/preferences-api.service.ts').read_text(encoding='utf-8-sig')
          if 'tenantId' in angular.lower(): raise SystemExit('Phase 10 Angular API client must not send or model TenantId.')
          PY

      - name: Start SQL Server 2022
        shell: bash
        run: |
          docker run -d --name phase10-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -p 14340:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in {1..60}; do
            if docker exec phase10-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then break; fi
            if [ "$i" = 60 ]; then docker logs phase10-sql; exit 1; fi
            sleep 2
          done

      - name: Validate V1.9.0 versioned upgrade twice on SQL Server 2022
        shell: bash
        run: |
          docker cp /tmp/CustSearchAi.phase9-base.sql phase10-sql:/tmp/base.sql
          docker cp database/09_Upgrade/V1.9.0_Phase10_PreferencesVoice.sql phase10-sql:/tmp/phase10.sql
          docker exec phase10-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -i /tmp/base.sql
          docker exec phase10-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/phase10.sql
          docker exec phase10-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/phase10.sql
          docker exec phase10-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -Q "IF (SELECT COUNT(*) FROM dbo.DatabaseVersions WHERE VersionNumber=N'V1.9.0')<>1 THROW 52901,'V1.9.0 duplicate/missing',1; IF OBJECT_ID(N'dbo.ProductCategoryAliases',N'U') IS NULL OR OBJECT_ID(N'dbo.VoiceCommandSessions',N'U') IS NULL OR OBJECT_ID(N'dbo.CustomerPreferenceScores',N'U') IS NULL THROW 52902,'Phase10 tables missing',1; IF OBJECT_DEFINITION(OBJECT_ID(N'dbo.HouseholdPreference_Get')) NOT LIKE '%IsVerified=1%' THROW 52903,'Verified household predicate missing',1;"

      - name: Validate standalone Phase 10 installer twice and verifier
        shell: bash
        run: |
          docker exec phase10-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "ALTER DATABASE [CustSearch_AI] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [CustSearch_AI];"
          docker exec phase10-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -i /tmp/base.sql
          docker cp database/run-phase10.sql phase10-sql:/tmp/run-phase10.sql
          docker cp database/verify-phase10.sql phase10-sql:/tmp/verify-phase10.sql
          docker exec phase10-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/run-phase10.sql
          docker exec phase10-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/run-phase10.sql
          docker exec phase10-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/verify-phase10.sql

      - name: Validate prospective final canonical fresh install through V1.9.0
        shell: bash
        run: |
          docker exec phase10-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "ALTER DATABASE [CustSearch_AI] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [CustSearch_AI];"
          docker cp /tmp/CustSearchAi.phase10-final.sql phase10-sql:/tmp/final.sql
          docker exec phase10-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -i /tmp/final.sql
          docker exec phase10-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -Q "IF (SELECT COUNT(*) FROM dbo.DatabaseVersions WHERE VersionNumber=N'V1.8.0')<>1 THROW 52910,'Canonical V1.8.0 invalid',1; IF (SELECT COUNT(*) FROM dbo.DatabaseVersions WHERE VersionNumber=N'V1.9.0')<>1 THROW 52911,'Canonical V1.9.0 invalid',1; IF OBJECT_ID(N'dbo.PlatformInvoices',N'U') IS NULL OR OBJECT_ID(N'dbo.ProductCategoryAliases',N'U') IS NULL OR OBJECT_ID(N'dbo.VoiceCommandSessions',N'U') IS NULL THROW 52912,'Canonical Phase9/10 objects missing',1; DBCC CHECKCONSTRAINTS WITH ALL_CONSTRAINTS;"

      - name: Persist validated Phase 10 canonical SQL
        if: github.event_name == 'push'
        shell: bash
        run: |
          cp /tmp/CustSearchAi.phase10-final.sql database/CustSearchAi.sql
          if git diff --quiet -- database/CustSearchAi.sql; then echo "Phase 10 canonical already persisted."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/CustSearchAi.sql
          git commit -m "phase10: persist V1.9 canonical SQL"
          git push origin HEAD:phase10-preferences-voice
