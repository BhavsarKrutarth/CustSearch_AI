name: Phase 14 Validate

on:
  push:
    branches: [phase14-consent-recognition]
  pull_request:
    branches: [phase13-cctv-tracking]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      SA_PASSWORD: 'CustSearch_Phase14_2026!Sql'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with: {dotnet-version: 8.0.424}
      - name: Setup Node for pinned Angular 21
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: src/CustSearch.Admin/package-lock.json
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Prepare validated Phase 13 baseline and prospective Phase 14 canonical
        shell: bash
        run: |
          git show origin/phase13-cctv-tracking:database/CustSearchAi.sql > /tmp/CustSearchAi.phase13-base.raw
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('/tmp/CustSearchAi.phase13-base.raw').read_bytes();enc='utf-16' if raw.startswith(b'\xff\xfe') else ('utf-8-sig' if raw.startswith(b'\xef\xbb\xbf') else 'utf-8');base=raw.decode(enc)
          if "VersionNumber=N'V1.12.0'" not in base: raise SystemExit('The tested Phase 13 branch must contain canonical V1.12.0 before Phase 14.')
          upgrade=Path('database/09_Upgrade/V1.13.0_Phase14_ConsentRecognition.sql').read_text(encoding='utf-8-sig')
          branch_raw=Path('database/CustSearchAi.sql').read_bytes();branch_enc='utf-16' if branch_raw.startswith(b'\xff\xfe') else ('utf-8-sig' if branch_raw.startswith(b'\xef\xbb\xbf') else 'utf-8');branch=branch_raw.decode(branch_enc)
          final=branch if "VersionNumber=N'V1.13.0'" in branch else base.rstrip()+"\n\n-- ============================================================\n-- PHASE 14 - CONSENT-BASED RECOGNITION\n-- VERSION: V1.13.0\n-- ============================================================\n"+upgrade.strip()+"\n"
          Path('/tmp/CustSearchAi.phase13-base.sql').write_text(base,encoding='utf-8');Path('/tmp/CustSearchAi.phase14-final.sql').write_text(final,encoding='utf-8')
          PY

      - name: Restore and build .NET Release
        run: dotnet restore CustSearch_AI.sln && dotnet build CustSearch_AI.sln --configuration Release --no-restore
      - name: Test .NET through Phase 14
        run: dotnet test CustSearch_AI.sln --configuration Release --no-build --logger "trx;LogFileName=phase14-tests.trx"
      - name: Install Angular dependencies reproducibly
        working-directory: src/CustSearch.Admin
        run: npm ci --no-audit --no-fund
      - name: Lint, test and build Angular through Phase 14
        working-directory: src/CustSearch.Admin
        run: npm run lint && npm run test:ci && npm run build:production
      - name: Prepare Playwright
        working-directory: tests/CustSearch.Admin.E2E
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run full Playwright regression through Phase 14
        working-directory: tests/CustSearch.Admin.E2E
        run: npm test
      - name: Ruff and pytest through Phase 14
        run: |
          python -m pip install --disable-pip-version-check -r src/CustSearch.AI/requirements-dev.txt
          ruff check src/CustSearch.AI tests/CustSearch.AI.Tests
          PYTHONPATH=src/CustSearch.AI python -m pytest -q tests/CustSearch.AI.Tests

      - name: Validate Phase 14 privacy, security and database structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[Path('database/09_Upgrade/V1.13.0_Phase14_ConsentRecognition.sql').read_text(),Path('database/run-phase14.sql').read_text()]
          required=['dbo.CustomerRecognitionConsents','dbo.BiometricTemplates','dbo.RecognitionCandidates','EncryptedTemplate','AuthenticationTag','UX_BiometricTemplates_Current','UX_RecognitionCandidates_Tenant_Store_Request','Recognition.Consent.Manage',"VersionNumber=N'V1.13.0'"]
          for text in files:
              missing=[x for x in required if x not in text]
              if missing: raise SystemExit(f'Missing Phase 14 SQL markers: {missing}')
              executable=re.sub(r'--[^\r\n]*','',re.sub(r'/\*.*?\*/','',text,flags=re.S)).lower()
              if ':r ' in executable or 'powershell' in executable: raise SystemExit('Phase 14 SQL must remain standalone T-SQL.')
              if re.search(r'\b(rawimage|faceimage|socialmedia|aadhaar|panmapping|externalidentity)\b',executable): raise SystemExit('Phase 14 SQL contains forbidden raw/external identity storage.')
          service=Path('src/CustSearch.Infrastructure/Recognition/RecognitionService.cs').read_text()
          entity=Path('src/CustSearch.Domain/Entities/PhaseFourteenRecognitionEntities.cs').read_text()
          controller=Path('src/CustSearch.API/Controllers/RecognitionController.cs').read_text()
          view=Path('src/CustSearch.Application/Recognition/IRecognitionService.cs').read_text()
          angular=Path('src/CustSearch.Admin/src/app/features/recognition/recognition-api.service.ts').read_text()
          if any(x not in service for x in ['IsActiveAt','RecognitionEnroll','RecognitionReview','DisableAndErase','TrackingSubjectKind.Anonymous','TrackAssociationChanged=false']): raise SystemExit('Consent, withdrawal, anonymous or human-review service gates are incomplete.')
          if '.AssociateCustomer(' in service or '.AssociateStaff(' in service: raise SystemExit('Recognition must never auto-associate a Phase 13 track.')
          if any(x not in entity for x in ['EncryptedTemplate','AuthenticationTag','RetentionUntilUtc','PendingReview','Ambiguous']): raise SystemExit('Encrypted template/retention/review entities are incomplete.')
          if 'JsonUnmappedMemberHandling.Disallow' not in controller or 'RejectClientTenantId' not in controller: raise SystemExit('Browser TenantId/unknown-field injection rejection is missing.')
          public_view=view.split('public sealed record BiometricTemplateView',1)[1].split(';',1)[0]
          if re.search(r'EncryptedTemplate|Nonce|AuthenticationTag|EncryptionKeyReference',public_view): raise SystemExit('Template metadata response exposes protected material or key reference.')
          angular_exec=re.sub(r'//[^\r\n]*','',re.sub(r'/\*.*?\*/','',angular,flags=re.S))
          if re.search(r'\btenantId\b',angular_exec,re.I): raise SystemExit('Angular recognition client must not accept browser TenantId.')
          settings=Path('src/CustSearch.API/appsettings.json').read_text()
          if '"Enabled": false' not in settings or '"EncryptionKeyBase64": ""' not in settings or 'HasValidEncryptionConfiguration' not in view: raise SystemExit('Recognition safe-default/encryption configuration gate is missing.')
          PY

      - name: Start SQL Server 2022
        run: |
          docker run -d --name phase14-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -p 14344:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in {1..60}; do if docker exec phase14-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1;then break;fi;if [ "$i" = 60 ];then docker logs phase14-sql;exit 1;fi;sleep 2;done
      - name: Validate V1.13.0 upgrade twice
        run: |
          docker cp /tmp/CustSearchAi.phase13-base.sql phase14-sql:/tmp/base.sql
          docker cp database/09_Upgrade/V1.13.0_Phase14_ConsentRecognition.sql phase14-sql:/tmp/phase14.sql
          docker exec phase14-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -i /tmp/base.sql
          docker exec phase14-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/phase14.sql
          docker exec phase14-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/phase14.sql
      - name: Validate standalone runner twice and verifier
        run: |
          docker exec phase14-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "ALTER DATABASE [CustSearch_AI] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;DROP DATABASE [CustSearch_AI];"
          docker exec phase14-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -i /tmp/base.sql
          docker cp database/run-phase14.sql phase14-sql:/tmp/run.sql
          docker cp database/verify-phase14.sql phase14-sql:/tmp/verify.sql
          docker exec phase14-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/run.sql
          docker exec phase14-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/run.sql
          docker exec phase14-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/verify.sql
      - name: Validate prospective canonical fresh install
        run: |
          docker exec phase14-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "ALTER DATABASE [CustSearch_AI] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;DROP DATABASE [CustSearch_AI];"
          docker cp /tmp/CustSearchAi.phase14-final.sql phase14-sql:/tmp/final.sql
          docker exec phase14-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -i /tmp/final.sql
          docker exec phase14-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -Q "IF(SELECT COUNT(*) FROM dbo.DatabaseVersions WHERE VersionNumber=N'V1.13.0')<>1 THROW 54820,'Canonical V1.13.0 invalid',1;IF OBJECT_ID(N'dbo.CustomerRecognitionConsents',N'U') IS NULL OR OBJECT_ID(N'dbo.BiometricTemplates',N'U') IS NULL OR OBJECT_ID(N'dbo.RecognitionCandidates',N'U') IS NULL THROW 54821,'Canonical Phase 14 objects missing',1;DBCC CHECKCONSTRAINTS WITH ALL_CONSTRAINTS;"
      - name: Stop SQL Server
        if: always()
        run: docker rm -f phase14-sql >/dev/null 2>&1 || true
      - name: Persist tested Phase 14 canonical SQL
        if: github.event_name == 'push'
        run: |
          cp /tmp/CustSearchAi.phase14-final.sql database/CustSearchAi.sql
          if git diff --quiet -- database/CustSearchAi.sql;then echo 'Phase 14 canonical already persisted.';exit 0;fi
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com";git add database/CustSearchAi.sql;git commit -m "phase14: persist V1.13 canonical SQL";git push origin HEAD:phase14-consent-recognition
