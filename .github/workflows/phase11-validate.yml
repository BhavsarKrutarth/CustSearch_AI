name: Phase 11 Validate

on:
  push:
    branches: [phase11-alerts-realtime]
  pull_request:
    branches: [AIMainBranch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SA_PASSWORD: 'CustSearch_Phase11_2026!Sql'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424

      - name: Setup Node for pinned Angular 21
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: src/CustSearch.Admin/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare validated Phase 10 baseline and prospective Phase 11 canonical
        shell: bash
        run: |
          git show origin/AIMainBranch:database/CustSearchAi.sql > /tmp/CustSearchAi.phase10-base.raw
          python3 - <<'PY'
          from pathlib import Path
          base_raw=Path('/tmp/CustSearchAi.phase10-base.raw').read_bytes()
          enc='utf-16' if base_raw.startswith(b'\xff\xfe') else ('utf-8-sig' if base_raw.startswith(b'\xef\xbb\xbf') else 'utf-8')
          base=base_raw.decode(enc)
          if "VersionNumber=N'V1.9.0'" not in base: raise SystemExit('AIMainBranch must contain validated Phase 10 V1.9.0 before Phase 11.')
          if "VersionNumber=N'V1.10.0'" in base: raise SystemExit('AIMainBranch must not contain Phase 11 V1.10.0 before Phase 11 merge.')
          upgrade=Path('database/09_Upgrade/V1.10.0_Phase11_AlertsRealtime.sql').read_text(encoding='utf-8-sig')
          branch_raw=Path('database/CustSearchAi.sql').read_bytes();branch_enc='utf-16' if branch_raw.startswith(b'\xff\xfe') else ('utf-8-sig' if branch_raw.startswith(b'\xef\xbb\xbf') else 'utf-8');branch=branch_raw.decode(branch_enc)
          final=branch if "VersionNumber=N'V1.10.0'" in branch else base.rstrip()+"\n\n-- ============================================================\n-- PHASE 11 - ALERTS & REAL-TIME\n-- VERSION: V1.10.0\n-- ============================================================\n"+upgrade.strip()+"\n"
          Path('/tmp/CustSearchAi.phase10-base.sql').write_text(base,encoding='utf-8');Path('/tmp/CustSearchAi.phase11-final.sql').write_text(final,encoding='utf-8')
          PY

      - name: Restore .NET
        run: dotnet restore CustSearch_AI.sln
      - name: Build .NET Release
        run: dotnet build CustSearch_AI.sln --configuration Release --no-restore
      - name: Test .NET through Phase 11
        run: dotnet test CustSearch_AI.sln --configuration Release --no-build --logger "trx;LogFileName=phase11-tests.trx"

      - name: Install Angular dependencies reproducibly
        working-directory: src/CustSearch.Admin
        run: npm ci --no-audit --no-fund
      - name: Angular version
        working-directory: src/CustSearch.Admin
        run: npx ng version
      - name: Lint Angular
        working-directory: src/CustSearch.Admin
        run: npm run lint
      - name: Test Angular through Phase 11
        working-directory: src/CustSearch.Admin
        run: npm run test:ci
      - name: Build Angular production
        working-directory: src/CustSearch.Admin
        run: npm run build:production

      - name: Prepare Playwright
        working-directory: tests/CustSearch.Admin.E2E
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts --no-audit --no-fund; fi
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run full Playwright regression through Phase 11
        working-directory: tests/CustSearch.Admin.E2E
        run: npm test

      - name: Validate Python baseline
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r src/CustSearch.AI/requirements-dev.txt
          ruff check src/CustSearch.AI tests/CustSearch.AI.Tests
          PYTHONPATH=src/CustSearch.AI python -m pytest -q tests/CustSearch.AI.Tests

      - name: Validate Phase 11 security and SQL structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          upgrade=Path('database/09_Upgrade/V1.10.0_Phase11_AlertsRealtime.sql').read_text(encoding='utf-8-sig')
          runner=Path('database/run-phase11.sql').read_text(encoding='utf-8-sig');verifier=Path('database/verify-phase11.sql').read_text(encoding='utf-8-sig')
          required=['dbo.Alerts','dbo.RealtimeEvents','dbo.NotificationOutbox','UX_Alerts_Tenant_DeduplicationKey','UX_NotificationOutbox_IdempotencyKey','dbo.AlertRecovery_Get','dbo.NotificationOutbox_Claim','UPDLOCK','READPAST',"VersionNumber=N'V1.10.0'"]
          missing=[x for x in required if x not in upgrade or x not in runner]
          if missing: raise SystemExit(f'Missing Phase 11 SQL elements: {missing}')
          def executable(text): return re.sub(r'--[^\r\n]*','',re.sub(r'/\*.*?\*/','',text,flags=re.S)).lower()
          for name,text in [('runner',runner),('verifier',verifier)]:
              low=executable(text)
              if ':r ' in low or 'powershell' in low: raise SystemExit(f'{name} must remain standalone T-SQL.')
          controller=Path('src/CustSearch.API/Controllers/AlertsRealtimeController.cs').read_text(encoding='utf-8-sig')
          hub=Path('src/CustSearch.API/AlertsRealtime/AlertHub.cs').read_text(encoding='utf-8-sig')
          service=Path('src/CustSearch.Infrastructure/AlertsRealtime/AlertsRealtimeService.cs').read_text(encoding='utf-8-sig')
          angular=Path('src/CustSearch.Admin/src/app/features/alerts/alerts-api.service.ts').read_text(encoding='utf-8-sig')
          if 'JsonUnmappedMemberHandling.Disallow' not in controller or 'RejectClientTenantId' not in controller: raise SystemExit('Phase 11 DTO/query TenantId rejection is missing.')
          request_section=controller[controller.index('public sealed record CreateAlertRequest'):]
          if re.search(r'CreateAlertRequest[^\n]*TenantId',request_section): raise SystemExit('CreateAlertRequest trusts browser TenantId.')
          if 'Groups.AddToGroupAsync' not in hub or 'AlertGroupNames.Tenant' not in hub or 'AlertGroupNames.Store' not in hub: raise SystemExit('Server-controlled hub membership is missing.')
          if re.search(r'public\s+(?:async\s+)?Task\s+(Join|Subscribe).*Group',hub,re.I): raise SystemExit('Hub exposes arbitrary group membership.')
          if 'BeginTransactionAsync' not in service or 'NotificationOutboxMessage.Queue' not in service or 'RealtimeEvent.Create' not in service: raise SystemExit('Transactional alert/outbox/event creation is missing.')
          if re.search(r'password|credential|access.?token',executable(upgrade),re.I): raise SystemExit('Phase 11 SQL must not store provider credentials.')
          if 'tenantId' in re.sub(r'export interface[^\n]+','',angular,flags=re.I).split('/** Typed Phase 11 REST client')[1].lower(): raise SystemExit('Phase 11 Angular request methods must not accept TenantId.')
          PY

      - name: Start SQL Server 2022
        shell: bash
        run: |
          docker run -d --name phase11-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -p 14341:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in {1..60}; do if docker exec phase11-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then break; fi;if [ "$i" = 60 ]; then docker logs phase11-sql;exit 1;fi;sleep 2;done

      - name: Validate V1.10.0 versioned upgrade twice on SQL Server 2022
        shell: bash
        run: |
          docker cp /tmp/CustSearchAi.phase10-base.sql phase11-sql:/tmp/base.sql
          docker cp database/09_Upgrade/V1.10.0_Phase11_AlertsRealtime.sql phase11-sql:/tmp/phase11.sql
          docker exec phase11-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -i /tmp/base.sql
          docker exec phase11-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/phase11.sql
          docker exec phase11-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/phase11.sql
          docker exec phase11-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -Q "IF (SELECT COUNT(*) FROM dbo.DatabaseVersions WHERE VersionNumber=N'V1.10.0')<>1 THROW 53901,'V1.10.0 duplicate/missing',1;IF OBJECT_ID(N'dbo.Alerts',N'U') IS NULL OR OBJECT_ID(N'dbo.RealtimeEvents',N'U') IS NULL OR OBJECT_ID(N'dbo.NotificationOutbox',N'U') IS NULL THROW 53902,'Phase11 tables missing',1;IF NOT EXISTS(SELECT 1 FROM sys.indexes WHERE object_id=OBJECT_ID(N'dbo.Alerts') AND name=N'UX_Alerts_Tenant_DeduplicationKey' AND is_unique=1) THROW 53903,'Deduplication index missing',1;"

      - name: Validate standalone Phase 11 installer twice and verifier
        shell: bash
        run: |
          docker exec phase11-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "ALTER DATABASE [CustSearch_AI] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;DROP DATABASE [CustSearch_AI];"
          docker exec phase11-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -i /tmp/base.sql
          docker cp database/run-phase11.sql phase11-sql:/tmp/run-phase11.sql
          docker cp database/verify-phase11.sql phase11-sql:/tmp/verify-phase11.sql
          docker exec phase11-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/run-phase11.sql
          docker exec phase11-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/run-phase11.sql
          docker exec phase11-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -i /tmp/verify-phase11.sql

      - name: Validate prospective final canonical fresh install through V1.10.0
        shell: bash
        run: |
          docker exec phase11-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "ALTER DATABASE [CustSearch_AI] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;DROP DATABASE [CustSearch_AI];"
          docker cp /tmp/CustSearchAi.phase11-final.sql phase11-sql:/tmp/final.sql
          docker exec phase11-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -i /tmp/final.sql
          docker exec phase11-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d CustSearch_AI -Q "IF (SELECT COUNT(*) FROM dbo.DatabaseVersions WHERE VersionNumber=N'V1.9.0')<>1 OR (SELECT COUNT(*) FROM dbo.DatabaseVersions WHERE VersionNumber=N'V1.10.0')<>1 THROW 53910,'Canonical version ledger invalid',1;IF OBJECT_ID(N'dbo.VoiceCommandSessions',N'U') IS NULL OR OBJECT_ID(N'dbo.NotificationOutbox',N'U') IS NULL THROW 53911,'Canonical Phase10/11 objects missing',1;DBCC CHECKCONSTRAINTS WITH ALL_CONSTRAINTS;"

      - name: Persist validated Phase 11 canonical SQL
        if: github.event_name == 'push'
        shell: bash
        run: |
          cp /tmp/CustSearchAi.phase11-final.sql database/CustSearchAi.sql
          if git diff --quiet -- database/CustSearchAi.sql; then echo "Phase 11 canonical already persisted.";exit 0;fi
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/CustSearchAi.sql;git commit -m "phase11: persist V1.10 canonical SQL";git push origin HEAD:phase11-alerts-realtime
